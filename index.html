<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fourth Seat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vollkorn:ital,wght@0,400;0,500;1,400&family=Vollkorn+SC:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060403;
    --ink: #f1e5cf;
    --dim: rgba(241, 229, 207, 0.58);
    --faint: rgba(241, 229, 207, 0.32);
    --amber: #e9ac60;
    --serif: "Vollkorn", Georgia, serif;
    --label: "Vollkorn SC", "Vollkorn", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--serif); overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  [hidden] { display: none !important; }

  /* ---------- Door ---------- */
  #door {
    position: fixed; inset: 0; overflow-y: auto;
    padding: 9vh 24px 6vh;
    background: radial-gradient(ellipse at 50% 0%, #140d08 0%, var(--bg) 60%);
  }
  .door-head { text-align: center; margin-bottom: 7vh; }
  .door-head h1 { font-weight: normal; font-size: clamp(2.2rem, 5vw, 3.6rem); margin: 0 0 .5rem; letter-spacing: .01em; }
  .door-head p { margin: 0; color: var(--dim); font-size: 1.1rem; font-style: italic; }
  /* Each table is a frame from its own scene: dark at rest, lit on hover. */
  .cards {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 4vh 22px; max-width: 1180px; margin: 0 auto;
  }
  .card { display: block; text-align: left; align-self: start; }
  .card .img {
    display: block; aspect-ratio: 4 / 3; border-radius: 10px;
    background: #0d0907 50% 30% / 205% auto no-repeat;
    filter: brightness(.34) saturate(.75); transition: filter .7s ease;
    box-shadow: inset 0 0 0 1px rgba(241, 229, 207, .06);
  }
  .card .q { display: block; font-size: 1.25rem; line-height: 1.25; margin-top: .9rem; color: rgba(241, 229, 207, .7); transition: color .4s; }
  .card .topic { display: block; font-family: var(--label); font-size: 1rem; letter-spacing: .03em; color: var(--amber); margin-top: .4rem; }
  .card .names { display: block; color: var(--dim); font-size: .98rem; margin-top: .1rem; }
  .card:hover .img, .card:focus-visible .img { filter: brightness(1) saturate(1); }
  .card:hover .q, .card:focus-visible .q { color: var(--ink); }
  .card:focus-visible { outline: none; }
  .card:focus-visible .img { box-shadow: inset 0 0 0 1px var(--faint); }

  /* ---------- Room ---------- */
  #room { position: fixed; inset: 0; }
  .scene {
    position: absolute; left: 50%; top: 50%;
    width: max(100vw, 176.84vh); aspect-ratio: 2688 / 1520;
    transform: translate(-50%, -50%);
    background: url(assets/room.jpg) center / cover no-repeat;
    filter: brightness(.5); transition: filter 1.2s ease;
  }
  #room[data-phase="care"] .scene { filter: brightness(.28); }
  #room[data-phase="seated"] .scene { filter: brightness(.78); }
  .glow {
    position: absolute; width: 30%; aspect-ratio: 1; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255, 186, 104, .42) 0%, rgba(255, 186, 104, .12) 32%, transparent 62%);
    mix-blend-mode: screen; opacity: 0; transition: opacity .7s ease; pointer-events: none;
  }
  .glow.on { opacity: 1; }
  .shade-bottom {
    position: absolute; inset: auto 0 0 0; height: 46vh; pointer-events: none;
    background: linear-gradient(transparent, rgba(6, 4, 3, .82) 70%);
  }

  .av {
    --s: 60px; width: var(--s); height: var(--s); flex: none; border-radius: 50%;
    background: #1a120c center / cover no-repeat;
    box-shadow: 0 0 0 1px rgba(241, 229, 207, .22), 0 8px 26px rgba(0, 0, 0, .85);
  }
  .av.mono { display: grid; place-items: center; font-size: calc(var(--s) * .42); color: var(--dim); text-shadow: none; }
  .say .av { --s: 72px; }
  .stance .av { --s: 60px; }
  .say .txt { min-width: 0; }
  .say.center { max-width: min(46vw, 640px); }
  .say {
    display: flex; align-items: center; gap: 16px;
    position: absolute; max-width: min(36vw, 500px); min-width: 260px;
    opacity: 0; transform: translateY(6px); transition: opacity .5s ease, transform .5s ease;
    pointer-events: none; text-shadow: 0 1px 14px #000, 0 0 3px #000;
  }
  .say.on { opacity: 1; transform: none; }
  .say .who { font-family: var(--label); font-size: .95rem; letter-spacing: .04em; text-transform: lowercase; color: var(--amber); margin-bottom: .35rem; }
  .say .line { font-size: clamp(1.1rem, 1.45vw, 1.4rem); line-height: 1.45; }

  .stance .line { font-size: clamp(1rem, 1.2vw, 1.15rem); color: var(--ink); font-style: italic; }

  .bottom {
    position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
    width: min(680px, 100% - 32px); padding-bottom: 28px;
    display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;
  }
  .preview-q { font-size: clamp(1.8rem, 3.4vw, 2.6rem); line-height: 1.25; text-shadow: 0 2px 20px #000; }
  .preview-topic { font-family: var(--label); font-size: .95rem; letter-spacing: .04em; text-transform: lowercase; color: var(--amber); margin-top: 6px; }
  .btn {
    padding: .7rem 1.6rem; border-radius: 999px; font-size: 1.05rem;
    background: rgba(241, 229, 207, .1); box-shadow: inset 0 0 0 1px rgba(241, 229, 207, .35);
    transition: background .3s, box-shadow .3s;
  }
  .btn:hover { background: rgba(241, 229, 207, .18); box-shadow: inset 0 0 0 1px rgba(241, 229, 207, .6); }
  .btn.warm { background: rgba(233, 172, 96, .2); box-shadow: inset 0 0 0 1px rgba(233, 172, 96, .6); }
  .link { color: var(--dim); font-size: .95rem; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--faint); }
  .link:hover { color: var(--ink); }

  .you {
    font-size: 1.15rem; line-height: 1.45; color: var(--ink); opacity: 0; transition: opacity .5s;
    text-shadow: 0 1px 14px #000;
  }
  .you.on { opacity: 1; }
  .you .who { font-family: var(--label); font-size: .95rem; letter-spacing: .04em; text-transform: lowercase; color: var(--dim); margin-bottom: .3rem; }

  .field {
    width: 100%; display: flex; align-items: center; gap: 8px;
    background: rgba(12, 9, 7, .72); border-radius: 14px; padding: 6px 6px 6px 18px;
    box-shadow: inset 0 0 0 1px rgba(241, 229, 207, .16);
    backdrop-filter: blur(6px);
  }
  .field:focus-within { box-shadow: inset 0 0 0 1px rgba(241, 229, 207, .4); }
  .field input {
    flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--ink);
    font: inherit; font-size: 1.05rem; padding: .6rem 0;
  }
  .field input::placeholder { color: var(--faint); font-style: italic; }
  .send { padding: .55rem 1rem; border-radius: 10px; color: var(--dim); font-size: .85rem; }
  .send:hover { color: var(--ink); background: rgba(241, 229, 207, .08); }

  .panel {
    width: 100%; padding: 20px 22px; border-radius: 14px; text-align: center;
    background: rgba(14, 10, 8, .86); box-shadow: inset 0 0 0 1px rgba(233, 172, 96, .3);
    backdrop-filter: blur(8px);
  }
  .panel h3 { margin: 0 0 .3rem; font-weight: normal; font-size: 1.35rem; }
  .panel p { margin: 0 0 1rem; color: var(--dim); }
  .panel .row { display: flex; gap: 18px; justify-content: center; align-items: center; flex-wrap: wrap; }
  .panel .why { margin: 1rem 0 0; font-size: .95rem; color: var(--dim); text-align: left; line-height: 1.5; }

  .care {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(520px, 100% - 32px); text-align: center; line-height: 1.6; font-size: 1.2rem;
  }
  .care p { margin: 0 0 1.4rem; }
  .care .note { font-size: .95rem; color: var(--dim); margin: -.6rem 0 1.2rem; }

  /* ---------- Trail: past lines ---------- */
  /* The last three lines stay as fading single lines; hovering (tapping on touch screens) opens the whole history. */
  .trail {
    width: 100%; text-align: left; font-size: 1.06rem; line-height: 1.75;
    max-height: 5.6em; overflow: hidden; border-radius: 12px;
    -webkit-mask-image: linear-gradient(rgba(0, 0, 0, .45), #000 1.6em); mask-image: linear-gradient(rgba(0, 0, 0, .45), #000 1.6em);
    text-shadow: 0 1px 10px #000;
    scrollbar-width: none;
    transition: max-height .4s ease, background .4s ease;
  }
  .trail::-webkit-scrollbar { display: none; }
  .trail:empty { display: none; }
  .trail .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .2; transition: opacity .5s; }
  .trail .t:nth-last-child(1) { opacity: .75; }
  .trail .t:nth-last-child(2) { opacity: .5; }
  .trail .t:nth-last-child(3) { opacity: .3; }
  .trail .t b { font-family: var(--label); font-weight: normal; font-size: 1.02rem; letter-spacing: .03em; color: var(--amber); margin-right: .6em; }
  .trail .t.me b { color: var(--dim); }
  .trail.reading {
    max-height: 42vh; overflow-y: auto; padding: 12px 16px;
    -webkit-mask-image: none; mask-image: none; background: rgba(8, 6, 4, .86);
  }
  .trail.reading .t { white-space: normal; opacity: 1; margin-bottom: .55rem; }

  .corner { position: absolute; top: 18px; font-size: .82rem; color: var(--faint); padding: 8px 10px; border-radius: 8px; }
  .corner:hover { color: var(--ink); }
  .corner.left { left: 12px; }
  .corner.right { right: 12px; font-size: 1.1rem; letter-spacing: .1em; }

  /* ---------- Settings ---------- */
  .sheet {
    position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px;
    background: rgba(4, 3, 2, .62); backdrop-filter: blur(3px);
  }
  .sheet-card {
    width: min(460px, 100%); max-height: calc(100vh - 32px); overflow-y: auto;
    padding: 22px 22px 20px; border-radius: 16px; background: rgba(14, 10, 8, .96);
    box-shadow: inset 0 0 0 1px rgba(241, 229, 207, .14), 0 24px 60px rgba(0, 0, 0, .7);
  }
  .sheet-card:focus { outline: none; }
  .sheet-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: .9rem; }
  .sheet-head h2 { margin: 0; font-weight: normal; font-size: 1.5rem; }
  .group { font-family: var(--label); font-size: .95rem; letter-spacing: .04em; text-transform: lowercase; color: var(--amber); margin: 1.4rem 0 .5rem; }
  .group.first { margin-top: 0; }
  /* The selected row is a tinted surface with a ring. Without credits, paid rows are dimmed and disabled. */
  .opt {
    width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 12px;
    text-align: left; color: var(--dim); transition: background .25s, box-shadow .25s, color .25s;
  }
  .opt + .opt { margin-top: 4px; }
  .opt:hover:not(:disabled) { background: rgba(241, 229, 207, .05); color: var(--ink); }
  .opt.on { background: rgba(233, 172, 96, .1); box-shadow: inset 0 0 0 1px rgba(233, 172, 96, .45); color: var(--ink); }
  .opt:disabled { opacity: .38; cursor: default; }
  .opt .dot { width: 14px; height: 14px; flex: none; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--faint); }
  .opt.on .dot { background: var(--amber); box-shadow: inset 0 0 0 1.5px var(--amber), inset 0 0 0 4px #0e0a08; }
  .opt .name { font-size: 1.08rem; }
  .opt .note { margin-left: auto; font-size: .92rem; color: var(--faint); text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .opt.on .note { color: var(--dim); }
  .free-note { margin: .7rem 2px 0; font-size: .95rem; color: var(--dim); font-style: italic; }
  .custom { margin-top: 8px; }
  .custom .field { padding: 2px 6px 2px 14px; border-radius: 10px; backdrop-filter: none; }
  .custom .field input { font-size: .98rem; padding: .5rem 0; }
  .custom-list { max-height: 210px; overflow-y: auto; margin-top: 6px; scrollbar-width: thin; scrollbar-color: rgba(241, 229, 207, .2) transparent; }
  .pick { width: 100%; display: flex; gap: 10px; align-items: baseline; padding: 7px 12px; border-radius: 8px; text-align: left; color: var(--dim); font-size: .98rem; }
  .pick:hover:not(:disabled) { background: rgba(241, 229, 207, .06); color: var(--ink); }
  .pick.on { color: var(--ink); background: rgba(233, 172, 96, .1); }
  .pick:disabled { opacity: .35; cursor: default; }
  .pick .tag { margin-left: auto; font-size: .85rem; color: var(--amber); }
  .custom-empty { padding: 10px 12px; color: var(--faint); font-style: italic; }
  .acct { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--dim); padding: 0 2px; }
  .btn.small { padding: .45rem 1.1rem; font-size: .95rem; }

  /* ---------- Phone ---------- */
  @media (max-width: 760px) {
    .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3vh 14px; }
    .card .q { font-size: 1.08rem; }
    .card .names { font-size: .86rem; }
  }
  @media (max-aspect-ratio: 4/5) {
    .scene { width: 190vw; top: 30vh; }
    .shade-bottom { height: 70vh; background: linear-gradient(transparent, var(--bg) 42%); }
    .say.stack { position: static; max-width: none; min-width: 0; text-align: left; }
    #stack { display: flex; flex-direction: column; gap: 14px; width: 100%; text-align: left; }
    .say.stack .line { font-size: 1.08rem; }
    .say.stack .av { --s: 46px; }
  }
  @media (min-aspect-ratio: 4/5) { #stack { display: contents; } }

  @media (hover: none) {
    .card .img { filter: brightness(.7) saturate(.9); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<section id="door">
  <div class="door-head">
    <h1>Pull up a chair.</h1>
    <p>Three philosophers. One question. Your seat.</p>
  </div>
  <div class="cards" id="cards"></div>
</section>

<section id="room" hidden>
  <div class="scene" id="scene">
    <div class="glow" data-seat="0"></div>
    <div class="glow" data-seat="1"></div>
    <div class="glow" data-seat="2"></div>
  </div>
  <div class="shade-bottom"></div>

  <div id="stances"></div>

  <div class="care" id="care" hidden>
    <p id="care-text"></p>
    <p><button class="link" id="care-help" type="button"></button></p>
    <p class="note" id="care-note" hidden></p>
    <button class="btn warm" id="care-go" type="button"></button>
  </div>

  <div class="bottom" id="bottom">
    <div class="trail" id="trail"></div>
    <div id="stack">
      <div class="say" id="say"><div class="av"></div><div class="txt"><div class="who"></div><div class="line"></div></div></div>
    </div>
    <div id="preview-block">
      <div class="preview-q" id="preview-q"></div>
      <div class="preview-topic" id="preview-topic"></div>
    </div>
    <button class="btn warm" id="sit" type="button">Sit down</button>

    <div class="you" id="you"><div class="who">You</div><div class="line"></div></div>
    <div class="panel" id="connect" hidden>
      <h3></h3><p></p>
      <div class="row">
        <button class="btn warm" id="connect-go" type="button"></button>
        <button class="link" id="connect-why" type="button"></button>
      </div>
      <p class="why" id="connect-why-text" hidden></p>
    </div>
    <button class="btn" id="carry" type="button" hidden>You carry on</button>
    <form class="field" id="field" hidden>
      <input id="input" autocomplete="off" placeholder="Say something to the table...">
      <button class="send" type="submit">Send</button>
    </form>
  </div>

  <button class="corner left" id="leave" type="button">Leave the table</button>
  <button class="corner right" id="gear" type="button" title="Settings" aria-label="Settings">&middot;&middot;&middot;</button>
</section>

<div class="sheet" id="settings" hidden>
  <div class="sheet-card" id="settings-card" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="sheet-head">
      <h2 id="settings-title"></h2>
      <button class="link" id="settings-close" type="button"></button>
    </div>
    <div class="group first" id="model-label"></div>
    <div id="opts" role="radiogroup" aria-labelledby="model-label"></div>
    <div class="custom" id="custom" hidden>
      <div class="field"><input id="custom-q" autocomplete="off"></div>
      <div class="custom-list" id="custom-list"></div>
    </div>
    <p class="free-note" id="free-note" hidden></p>
    <div class="group" id="account-label"></div>
    <div class="acct"><span id="acct-text"></span><button id="acct-btn" type="button"></button></div>
  </div>
</div>

<script src="data.js"></script>
<script src="models.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var door = $("door"), room = $("room"), scene = $("scene");
  var say = $("say"), you = $("you"), trail = $("trail");
  var state = { table: null, sent: false };
  // The account carries over between tables. For previews, ?account=free starts connected without credits and ?account=credits with credits.
  var start = new URLSearchParams(location.search).get("account");
  var acct = { connected: start === "free" || start === "credits", credits: start !== "free", model: DEFAULT_MODEL, custom: null };
  var customOpen = false;
  var run = 0, skip = null, current = null;

  // Door: one card per table
  TABLES.forEach(function (t) {
    var b = document.createElement("button");
    b.className = "card"; b.type = "button";
    b.innerHTML = '<span class="img"></span><span class="q"></span><span class="topic"></span><span class="names"></span>';
    b.querySelector(".img").style.backgroundImage = "url(" + (t.scene || "assets/room.jpg") + ")";
    b.querySelector(".q").textContent = t.question;
    b.querySelector(".topic").textContent = t.topic;
    b.querySelector(".names").textContent = t.people.map(function (p) { return p.name; }).join(" · ");
    b.onclick = function () { location.hash = t.id; };
    $("cards").appendChild(b);
  });

  scene.querySelectorAll(".glow").forEach(function (g) {
    var s = SEATS[Number(g.dataset.seat)];
    g.style.left = s.x + "%"; g.style.top = (s.y + 6) + "%";
  });

  function stacked() { return window.matchMedia("(max-aspect-ratio: 4/5)").matches; }

  function wait(ms) {
    return new Promise(function (res) {
      var t = setTimeout(function () { skip = null; res(); }, ms);
      skip = function () { clearTimeout(t); skip = null; res(); };
    });
  }

  // Where a line sits on screen: side seats above the speaker's head, the middle seat above the lamp.
  function place(el, seat) {
    el.classList.remove("center", "stack");
    if (stacked()) { el.classList.add("stack"); el.style.left = el.style.top = ""; return; }
    var r = scene.getBoundingClientRect();
    var w = el.offsetWidth, h = el.offsetHeight, vw = innerWidth;
    var x, bottom;
    if (seat === 1) {
      el.classList.add("center");
      x = r.left + r.width * 0.518 - w / 2;
      var top = Math.max(22, r.top + r.height * 0.02);
      el.style.left = Math.min(Math.max(16, x), vw - w - 16) + "px";
      el.style.top = top + "px";
      return;
    }
    var ax = seat === 0 ? 0.25 : 0.75;
    x = r.left + r.width * ax - w / 2;
    bottom = r.top + r.height * 0.27;
    el.style.left = Math.min(Math.max(16, x), vw - w - 16) + "px";
    el.style.top = Math.max(70, bottom - h) + "px";
  }

  function glow(seat) {
    scene.querySelectorAll(".glow").forEach(function (g) {
      g.classList.toggle("on", Number(g.dataset.seat) === seat);
    });
  }

  function showLine(line) {
    var t = state.table;
    say.replaceChild(avatar(t.people[line[0]]), say.querySelector(".av"));
    say.querySelector(".who").textContent = t.people[line[0]].name;
    say.querySelector(".line").textContent = line[1];
    if (stacked()) { $("stack").appendChild(say); } else { room.appendChild(say); }
    place(say, line[0]);
    glow(line[0]);
    say.classList.add("on");
    current = line;
  }

  // A line that leaves the screen is appended to the trail.
  function hideLine() {
    if (current) { toTrail(state.table.people[current[0]].name, current[1], false); current = null; }
    say.classList.remove("on");
  }

  function toTrail(name, text, me) {
    var d = document.createElement("div");
    d.className = me ? "t me" : "t";
    d.innerHTML = "<b></b><span></span>";
    d.querySelector("b").textContent = name;
    d.querySelector("span").textContent = text;
    trail.appendChild(d);
    if (!trail.classList.contains("reading")) trail.scrollTop = trail.scrollHeight;
  }

  // The user's line moves to the trail once the philosophers start speaking.
  function retireYou() {
    if (!you.classList.contains("on")) return;
    you.classList.remove("on");
    toTrail("You", you.querySelector(".line").textContent, true);
  }

  function reading(on) {
    trail.classList.toggle("reading", on);
    trail.scrollTop = trail.scrollHeight;
  }
  trail.addEventListener("pointerenter", function (e) { if (e.pointerType === "mouse") reading(true); });
  trail.addEventListener("pointerleave", function (e) { if (e.pointerType === "mouse") reading(false); });
  trail.addEventListener("pointerup", function (e) {
    if (e.pointerType !== "mouse") reading(!trail.classList.contains("reading"));
  });

  async function play(lines, keepLast) {
    var me = ++run;
    for (var i = 0; i < lines.length; i++) {
      if (me !== run) return false;
      hideLine();
      await wait(i === 0 ? 250 : 450);
      if (me !== run) return false;
      showLine(lines[i]);
      await wait(readTime(lines[i][1]));
    }
    if (me !== run) return false;
    if (!keepLast) { hideLine(); glow(-1); }
    return true;
  }

  // Views
  function toDoor() {
    run++; room.hidden = true; door.hidden = false; hideLine(); glow(-1);
  }

  function toPreview(t) {
    run++;
    state = { table: t, sent: false };
    door.hidden = true; room.hidden = false; room.dataset.phase = "preview";
    scene.style.backgroundImage = "url(" + (t.scene || "assets/room.jpg") + ")";
    hideLine(); glow(-1);
    you.classList.remove("on");
    trail.innerHTML = ""; reading(false);
    ["care", "connect", "carry", "field"].forEach(function (id) { $(id).hidden = true; });
    $("preview-block").hidden = false; $("sit").hidden = false;
    $("preview-q").textContent = t.question;
    $("preview-topic").textContent = t.topic;
    var box = $("stances"); box.innerHTML = "";
    t.people.forEach(function (p, i) {
      var s = document.createElement("div");
      s.className = "say stance on";
      s.dataset.seat = i;
      s.innerHTML = '<div class="txt"><div class="who"></div><div class="line"></div></div>';
      s.insertBefore(avatar(p), s.firstChild);
      s.querySelector(".who").textContent = p.name;
      s.querySelector(".line").textContent = p.stance;
      box.appendChild(s);
    });
    requestAnimationFrame(placeStances);
  }

  function placeStances() {
    var list = Array.from(document.querySelectorAll(".stance"));
    list.forEach(function (s) {
      if (stacked()) {
        s.classList.add("stack");
        $("stack").appendChild(s);
      } else {
        $("stances").appendChild(s);
        place(s, Number(s.dataset.seat));
      }
    });
  }

  function clearStances() {
    document.querySelectorAll(".stance").forEach(function (s) { s.remove(); });
  }

  function sit() {
    var t = state.table;
    clearStances();
    $("preview-block").hidden = true; $("sit").hidden = true;
    if (t.care) {
      room.dataset.phase = "care";
      $("care-text").textContent = CARE.text;
      $("care-help").textContent = CARE.help;
      $("care-note").textContent = CARE.helpNote;
      $("care-note").hidden = true;
      $("care-go").textContent = CARE.go;
      $("care").hidden = false;
      return;
    }
    seat();
  }

  async function seat() {
    $("care").hidden = true;
    room.dataset.phase = "seated";
    var t = state.table;
    await wait(700);
    var ok = await play(t.opening, false);
    if (!ok) return;
    ok = await play([t.turn], true);
    if (!ok) return;
    $("field").hidden = false;
    $("input").focus();
  }

  async function answer() {
    var t = state.table;
    await wait(1600);
    retireYou();
    $("carry").hidden = true;
    var ok = await play(t.reply, true);
    if (ok) $("carry").hidden = false;
  }

  $("sit").onclick = function () { location.hash = state.table.id + "/seat"; };
  $("care-go").onclick = seat;
  $("care-help").onclick = function () { $("care-note").hidden = false; };
  $("leave").onclick = function () { location.hash = ""; };

  $("field").onsubmit = function (e) {
    e.preventDefault();
    var v = $("input").value.trim();
    if (!v) return;
    $("input").value = "";
    run++; hideLine(); glow(-1);
    you.querySelector(".line").textContent = v;
    you.classList.add("on");
    state.sent = true;
    if (!acct.connected) {
      var c = $("connect");
      c.querySelector("h3").textContent = CONNECT.title;
      c.querySelector("p").textContent = CONNECT.body;
      $("connect-go").textContent = CONNECT.button;
      $("connect-why").textContent = CONNECT.why;
      $("connect-why-text").textContent = CONNECT.whyText;
      $("connect-why-text").hidden = true;
      c.hidden = false; $("field").hidden = true;
      return;
    }
    answer();
  };

  $("connect-why").onclick = function () { $("connect-why-text").hidden = !$("connect-why-text").hidden; };
  $("connect-go").onclick = async function () {
    $("connect-go").textContent = "Connecting...";
    await connect();
  };

  // Placeholder connection: waits a moment, then counts as connected. A message waiting for an answer gets one.
  async function connect() {
    await new Promise(function (r) { setTimeout(r, 1100); });
    acct.connected = true;
    if (!$("connect").hidden) { $("connect").hidden = true; $("field").hidden = false; answer(); }
  }

  // Settings
  function freeTier() { return acct.connected && !acct.credits; }

  // The option actually in use: without credits, a paid choice falls back to the free model.
  function chosen() {
    if (acct.model === "custom" && acct.custom && (!freeTier() || acct.custom.free)) return "custom";
    var m = MODELS.find(function (x) { return x.id === acct.model; });
    if (m && (!freeTier() || m.free)) return m.id;
    return freeTier() ? MODELS[0].id : DEFAULT_MODEL;
  }

  function option(name, note, on, off, pick) {
    var b = document.createElement("button");
    b.type = "button"; b.className = on ? "opt on" : "opt"; b.disabled = off;
    b.setAttribute("role", "radio"); b.setAttribute("aria-checked", on ? "true" : "false");
    b.innerHTML = '<span class="dot"></span><span class="name"></span><span class="note"></span>';
    b.querySelector(".name").textContent = name;
    b.querySelector(".note").textContent = note;
    b.onclick = pick;
    return b;
  }

  function renderSettings() {
    var S = SETTINGS, free = freeTier(), use = chosen(), box = $("opts");
    $("settings-title").textContent = S.title;
    $("settings-close").textContent = S.done;
    $("model-label").textContent = S.model;
    $("account-label").textContent = S.account;
    box.innerHTML = "";
    MODELS.forEach(function (m) {
      box.appendChild(option(m.name, m.note, use === m.id && !customOpen, free && !m.free, function () {
        acct.model = m.id; customOpen = false; renderSettings();
      }));
    });
    var customNote = use === "custom" ? acct.custom.name : S.customNote;
    box.appendChild(option(S.custom, customNote, use === "custom" || customOpen, false, function () {
      customOpen = true; $("custom-q").value = ""; renderSettings(); $("custom-q").focus();
    }));
    $("free-note").textContent = S.freeLine;
    $("free-note").hidden = !free;
    $("custom").hidden = !customOpen;
    $("custom-q").placeholder = S.search;
    if (customOpen) renderCustom();
    $("acct-text").textContent = acct.connected ? S.connected : S.notConnected;
    $("acct-btn").textContent = acct.connected ? S.disconnect : S.connect;
    $("acct-btn").className = acct.connected ? "link" : "btn warm small";
  }

  function renderCustom() {
    var q = $("custom-q").value.trim().toLowerCase(), list = $("custom-list"), free = freeTier();
    var hits = ALL_MODELS.filter(function (m) { return !q || m.name.toLowerCase().indexOf(q) >= 0; });
    // Without credits, the selectable free models come first and the paid ones follow, dimmed.
    if (free) hits = hits.filter(function (m) { return m.free; }).concat(hits.filter(function (m) { return !m.free; }));
    hits = hits.slice(0, 80);
    list.innerHTML = "";
    if (!hits.length) {
      var e = document.createElement("div");
      e.className = "custom-empty"; e.textContent = SETTINGS.none;
      list.appendChild(e);
      return;
    }
    hits.forEach(function (m) {
      var b = document.createElement("button");
      b.type = "button"; b.disabled = free && !m.free;
      b.className = acct.custom && acct.custom.id === m.id ? "pick on" : "pick";
      b.innerHTML = '<span class="nm"></span>' + (m.free ? '<span class="tag">Free</span>' : "");
      b.querySelector(".nm").textContent = m.name;
      b.onclick = function () { acct.custom = m; acct.model = "custom"; customOpen = false; renderSettings(); };
      list.appendChild(b);
    });
  }

  function openSettings(withCustom) {
    customOpen = !!withCustom;
    $("custom-q").value = "";
    renderSettings();
    $("settings").hidden = false;
    // Focus goes to the card: Tab moves through the options, Esc closes.
    $("settings-card").focus();
  }
  function closeSettings() { $("settings").hidden = true; }

  $("gear").onclick = function () { openSettings(false); };
  $("settings-close").onclick = closeSettings;
  $("settings").addEventListener("click", function (e) { if (e.target === $("settings")) closeSettings(); });
  addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("settings").hidden) closeSettings(); });
  $("custom-q").oninput = renderCustom;
  $("acct-btn").onclick = async function () {
    if (acct.connected) { acct.connected = false; renderSettings(); return; }
    $("acct-btn").textContent = "Connecting..."; $("acct-btn").disabled = true;
    await connect();
    $("acct-btn").disabled = false;
    renderSettings();
  };

  $("carry").onclick = async function () {
    $("carry").hidden = true;
    retireYou();
    var ok = await play(state.table.carry, true);
    if (ok) $("carry").hidden = false;
  };

  // Clicking the scene skips the line that is waiting.
  room.addEventListener("click", function (e) {
    if (e.target.closest("button, form, .panel, .trail")) return;
    if (skip) skip();
  });

  addEventListener("resize", function () {
    if (room.hidden) return;
    if (say.classList.contains("on")) {
      var name = say.querySelector(".who").textContent;
      var seatNo = state.table.people.findIndex(function (p) { return p.name === name; });
      place(say, seatNo);
    }
    if (room.dataset.phase === "preview") placeStances();
  });

  function route() {
    var parts = location.hash.replace("#", "").split("/");
    var t = TABLES.find(function (x) { return x.id === parts[0]; });
    if (!t) return toDoor();
    toPreview(t);
    if (parts[1] === "seat") sit();
    if (parts[1] === "settings") openSettings(parts[2] === "custom");
  }
  addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
